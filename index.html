<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar PRO - Orçamentos</title>
  
  <!-- Fontes Google -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <div id="app-container">
    <!-- Componente de Carregamento -->
    <div id="loader" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center">
      <div class="w-16 h-16 border-4 border-yellow-400 border-t-transparent rounded-full animate-spin"></div>
      <p class="mt-4 text-slate-400 font-medium tracking-widest">CARREGANDO SOLAR PRO...</p>
    </div>

    <!-- Conteúdo Dinâmico -->
    <div id="main-content" class="hidden">
      <!-- Injetado via JS -->
    </div>
  </div>

  <!-- Templates -->
  <template id="tpl-auth">
    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="glass max-w-md w-full p-8 rounded-2xl animate-fade-in">
        
        <div class="text-center mb-8">
          <div class="mx-auto w-16 h-16 bg-yellow-400 rounded-2xl flex items-center justify-center text-slate-900 text-3xl mb-4 shadow-xl shadow-yellow-400/20">
            ☀
          </div>
          <h2 class="text-3xl font-bold tracking-tight">Solar PRO</h2>
          <p class="text-slate-400 mt-2" id="auth-subtitle">Acesso Restrito</p>
        </div>

        <div id="auth-login-box">
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1">E-mail</label>
              <input type="email" id="login-email" class="input-glass w-full rounded-xl px-4 py-3" placeholder="seu@email.com">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1">Senha</label>
              <input type="password" id="login-pass" class="input-glass w-full rounded-xl px-4 py-3" placeholder="••••••••">
            </div>
            <button id="btn-login" class="btn-primary w-full py-4 rounded-xl mt-6 shadow-lg">ENTRAR NO SISTEMA</button>
          </div>
          <p class="text-center text-slate-400 text-sm mt-4">
            <a href="#" id="link-to-reset" class="text-slate-500 hover:text-yellow-400 transition-colors">Esqueci minha senha</a>
          </p>
          <p class="text-center text-slate-400 text-sm mt-2">
            Não tem conta? <a href="#" id="link-to-signup" class="text-yellow-400 font-bold hover:underline">Cadastre-se</a>
          </p>
        </div>

        <div id="auth-signup-box" class="hidden">
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1">E-mail</label>
              <input type="email" id="signup-email" class="input-glass w-full rounded-xl px-4 py-3" placeholder="seu@email.com">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1">Senha</label>
              <input type="password" id="signup-pass" class="input-glass w-full rounded-xl px-4 py-3" placeholder="••••••••">
            </div>
            <button id="btn-signup" class="btn-primary w-full py-4 rounded-xl mt-6 shadow-lg">CRIAR MINHA CONTA</button>
          </div>
          <p class="text-center text-slate-400 text-sm mt-6">
            Já possui conta? <a href="#" id="link-to-login" class="text-yellow-400 font-bold hover:underline">Fazer Login</a>
          </p>
        </div>

        <div id="auth-reset-box" class="hidden">
          <p class="text-slate-400 text-sm text-center mb-6">
            Informe seu e-mail e enviaremos um link para redefinir sua senha.
          </p>
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1">E-mail</label>
              <input type="email" id="reset-email" class="input-glass w-full rounded-xl px-4 py-3" placeholder="seu@email.com">
            </div>
            <button id="btn-reset" class="btn-primary w-full py-4 rounded-xl mt-2 shadow-lg">ENVIAR LINK DE RECUPERAÇÃO</button>
          </div>
          <p class="text-center text-slate-400 text-sm mt-6">
            <a href="#" id="link-back-to-login" class="text-yellow-400 font-bold hover:underline">Voltar ao login</a>
          </p>
        </div>

        <div id="auth-newpass-box" class="hidden">
          <p class="text-slate-400 text-sm text-center mb-6">
            Defina sua nova senha de acesso ao sistema.
          </p>
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1">Nova Senha</label>
              <input type="password" id="newpass-input" class="input-glass w-full rounded-xl px-4 py-3" placeholder="••••••••">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1">Confirmar Senha</label>
              <input type="password" id="newpass-confirm" class="input-glass w-full rounded-xl px-4 py-3" placeholder="••••••••">
            </div>
            <button id="btn-newpass" class="btn-primary w-full py-4 rounded-xl mt-2 shadow-lg">SALVAR NOVA SENHA</button>
          </div>
        </div>

        <div id="auth-message" class="mt-4 p-3 rounded-lg text-sm text-center hidden"></div>
      </div>
    </div>
  </template>

  <template id="tpl-dashboard">
    <div class="flex flex-col min-h-screen">
      <!-- Navbar -->
      <nav class="glass sticky top-0 z-40 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <span class="text-2xl">☀</span>
          <h1 class="text-xl font-bold tracking-tight">Solar <span class="text-yellow-400">PRO</span></h1>
        </div>
        <div class="flex items-center gap-6">
          <div class="flex gap-4 border-b border-white/5">
            <div class="nav-tab py-2 active" data-tab="empresa">Minha Empresa</div>
            <div class="nav-tab py-2" data-tab="clientes">Clientes</div>
            <div class="nav-tab py-2" data-tab="sizing">Dimensionamento</div>
            <div class="nav-tab py-2" data-tab="orcamentos">Orçamentos</div>
          </div>
          <div class="bg-slate-800 h-8 w-px mx-2"></div>
          <div class="flex items-center gap-3">
            <div class="text-right hidden md:block">
              <p class="text-xs text-slate-400 uppercase tracking-widest font-bold">Logado como</p>
              <p class="text-sm font-semibold" id="nav-user-name">Usuário</p>
            </div>
            <button id="btn-logout" class="p-2 hover:bg-white/5 rounded-full text-slate-400 hover:text-white transition-colors" title="Sair">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
          </div>
        </div>
      </nav>
    
      <!-- Content Container -->
      <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
        <div id="tab-content" class="animate-fade-in">
          <!-- Injetado via JS -->
        </div>
      </main>
    </div>
  </template>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
