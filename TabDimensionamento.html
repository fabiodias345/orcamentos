<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
  
  <!-- Configurações de Dimensionamento -->
  <div class="lg:col-span-2 space-y-8">
    <div class="glass p-8 rounded-2xl">
      <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
        <span class="text-yellow-400">01.</span> Necessidade Energética
      </h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Consumo Médio (kWh/mês)</label>
          <input type="number" id="calc-consumption" class="input-glass w-full p-4 rounded-xl text-2xl font-bold text-yellow-400" placeholder="600">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Estado / Irradiação (HSP)</label>
          <select id="calc-hsp" class="input-glass w-full p-4 rounded-xl appearance-none">
            <option value="">Selecione o Estado...</option>
            <!-- Opções via JS -->
          </select>
        </div>
      </div>
    </div>

    <div class="glass p-8 rounded-2xl">
      <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
        <span class="text-yellow-400">02.</span> Escolha de Equipamentos
      </h2>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Módulo Fotovoltaico</label>
          <select id="calc-module" class="input-glass w-full p-4 rounded-xl">
            <option value="">Carregando catálogo...</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Inversor de Tensão</label>
          <select id="calc-inverter" class="input-glass w-full p-4 rounded-xl">
            <option value="">Carregando catálogo...</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Resultado Lateral -->
  <div class="space-y-8">
    <div class="glass p-8 rounded-2xl border-t-4 border-yellow-400 sticky top-24">
      <h3 class="text-lg font-bold mb-4 uppercase tracking-widest text-slate-400 text-sm">Resumo do Sistema</h3>
      
      <div class="space-y-6">
        <div>
          <p class="text-xs text-slate-500 uppercase font-bold">Potência Instalada</p>
          <div class="flex items-end gap-2">
            <span class="text-4xl font-bold" id="res-kwp">0.00</span>
            <span class="text-yellow-400 font-bold mb-1">kWp</span>
          </div>
        </div>

        <div class="p-4 bg-white/5 rounded-xl space-y-2">
          <div class="flex justify-between text-sm">
            <span class="text-slate-400">Qtd. Módulos:</span>
            <span class="font-bold" id="res-mod-qty">0</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-slate-400">Produção Estimada:</span>
            <span class="font-bold" id="res-prod">0 kWh</span>
          </div>
        </div>

        <button onclick="UI.generateQuote()" class="btn-primary w-full py-4 rounded-xl shadow-xl">SALVAR ORÇAMENTO</button>
      </div>
    </div>
  </div>

</div>
