<div class="glass p-8 rounded-2xl max-w-2xl mx-auto">
  <div class="flex items-center gap-4 mb-6">
    <div class="p-3 bg-yellow-400 rounded-xl text-slate-900">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    </div>
    <h2 class="text-2xl font-bold text-yellow-400">Dados da Minha Empresa</h2>
  </div>

  <form id="form-empresa" class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-tighter mb-2">Nome Comercial</label>
        <input type="text" id="emp-nome" class="input-glass w-full p-4 rounded-xl" placeholder="Ex: Solar Plus">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-tighter mb-2">CNPJ</label>
        <input type="text" id="emp-cnpj" class="input-glass w-full p-4 rounded-xl" placeholder="00.000.000/0001-00">
      </div>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-500 uppercase tracking-tighter mb-2">Endereço Completo</label>
      <input type="text" id="emp-end" class="input-glass w-full p-4 rounded-xl" placeholder="Av. Principal, 1000 - Centro">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-tighter mb-2">E-mail Comercial</label>
        <input type="email" id="emp-email" class="input-glass w-full p-4 rounded-xl" placeholder="contato@empresa.com">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-tighter mb-2">Telefone</label>
        <input type="text" id="emp-tel" class="input-glass w-full p-4 rounded-xl" placeholder="(00) 0000-0000">
      </div>
    </div>

    <div>
      <label class="block text-xs font-bold text-slate-500 uppercase tracking-tighter mb-2">URL da Logomarca</label>
      <input type="text" id="emp-logo" class="input-glass w-full p-4 rounded-xl" placeholder="https://link-da-imagem.png">
    </div>

    <button type="button" onclick="UI.saveEmpresa()" class="btn-primary w-full py-4 rounded-2xl shadow-xl">SALVAR ALTERAÇÕES</button>
  </form>
</div>
