<script>
  /**
   * CORE ENGINE: SOLAR PRO - Dashboard & Abas
   * Auth fica em AuthScripts.html (separado)
   */
  const App = {
    state: {
      isLoggedIn: false,
      user: null,
      activeTab: 'empresa',
      catalogos: null,
      clientes: []
    },

    init: () => {
      const savedUser = localStorage.getItem('solar_pro_user');
      if (savedUser) {
        App.state.user = JSON.parse(savedUser);
        App.state.isLoggedIn = true;
        Router.render('dashboard');
        Data.loadCatalogs();
      } else {
        Router.render('auth');
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('main-content').classList.remove('hidden');
      }
    }
  };

  const Data = {
    loadCatalogs: () => {
      google.script.run
        .withSuccessHandler(cat => {
          App.state.catalogos = cat;
          document.getElementById('loader').classList.add('hidden');
          document.getElementById('main-content').classList.remove('hidden');
          if (App.state.activeTab === 'sizing') UI.renderSizing();
        })
        .getCatalogos();
      Data.loadClientes();
    },
    loadClientes: (callback) => {
      google.script.run
        .withSuccessHandler(list => {
          App.state.clientes = list || [];
          if (callback) callback();
        }).listarClientes(App.state.user.id);
    }
  };

  const Router = {
    render: (view) => {
      const container = document.getElementById('main-content');
      if (view === 'auth') {
        container.innerHTML = document.getElementById('tpl-auth').innerHTML;
      } else {
        container.innerHTML = document.getElementById('tpl-dashboard').innerHTML;
        document.getElementById('nav-user-name').innerText = App.state.user.nome;
        Router.renderTab(App.state.activeTab);
      }
    },
    to: (tab) => {
      App.state.activeTab = tab;
      Router.renderTab(tab);
      document.querySelectorAll('.nav-tab').forEach(el => {
        el.classList.remove('active');
        if (el.innerText.toLowerCase().includes(tab.substring(0, 3))) el.classList.add('active');
      });
    },
    renderTab: (tab) => {
      const container = document.getElementById('tab-content');
      container.innerHTML = `<div class="p-12 text-center text-slate-500">Carregando...</div>`;
      switch (tab) {
        case 'empresa': UI.renderEmpresa(); break;
        case 'clientes': UI.renderClientes(); break;
        case 'sizing': UI.renderSizing(); break;
        case 'orcamentos': UI.renderOrcamentos(); break;
      }
    }
  };

  // =============================================
  // UI - RENDERIZAÇÃO DAS ABAS
  // =============================================
  const UI = {

    // ---------- ABA EMPRESA ----------
    renderEmpresa: () => {
      const container = document.getElementById('tab-content');
      google.script.run.withSuccessHandler(d => {
        container.innerHTML = `
          <div class="glass p-8 rounded-2xl max-w-2xl mx-auto animate-fade-in">
            <h2 class="text-2xl font-bold mb-6 text-yellow-400">Minha Empresa</h2>
            <div class="space-y-4">
              <input type="text" id="emp-nome" placeholder="Nome Comercial" class="input-glass p-3 rounded-lg w-full" value="${d?.nome || ''}">
              <div class="grid grid-cols-2 gap-4">
                <input type="text" id="emp-cnpj" placeholder="CNPJ" class="input-glass p-3 rounded-lg" value="${d?.cnpj || ''}">
                <input type="text" id="emp-tel" placeholder="Telefone" class="input-glass p-3 rounded-lg" value="${d?.tel || ''}">
              </div>
              <input type="text" id="emp-email" placeholder="E-mail" class="input-glass p-3 rounded-lg w-full" value="${d?.email || ''}">
              <input type="text" id="emp-end" placeholder="Endereço Completo" class="input-glass p-3 rounded-lg w-full" value="${d?.end || ''}">
              <input type="text" id="emp-logo" placeholder="URL da Logomarca (Png/Jpg)" class="input-glass p-3 rounded-lg w-full" value="${d?.logo || ''}">
              <button onclick="UI.saveEmpresa()" class="btn-primary w-full py-3 rounded-xl mt-4">SALVAR MINHA EMPRESA</button>
            </div>
          </div>
        `;
      }).buscarEmpresa(App.state.user.id);
    },

    saveEmpresa: () => {
      const dados = {
        nome: document.getElementById('emp-nome').value,
        cnpj: document.getElementById('emp-cnpj').value,
        tel: document.getElementById('emp-tel').value,
        email: document.getElementById('emp-email').value,
        end: document.getElementById('emp-end').value,
        logo: document.getElementById('emp-logo').value
      };
      google.script.run.withSuccessHandler(() => alert('Configurações Salvas!')).salvarEmpresa(App.state.user.id, dados);
    },

    // ---------- ABA CLIENTES ----------
    renderClientes: () => {
      document.getElementById('tab-content').innerHTML = `
        <div class="glass p-8 rounded-2xl mb-8">
           <h2 class="text-xl font-bold mb-6 text-yellow-400">Cadastrar/Editar Cliente</h2>
           <input type="hidden" id="cli-id" value="">
           <div class="space-y-6">
             <div>
                 <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4 border-b border-white/5 pb-2">Informações Pessoais</h3>
                 <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                   <div class="flex flex-col"><label class="text-xs text-slate-500 mb-1 ml-1 font-semibold">NOME COMPLETO</label><input type="text" id="cli-nome" placeholder="Ex: João da Silva" class="input-glass p-3 rounded-lg text-white"></div>
                   <div class="flex flex-col"><label class="text-xs text-slate-500 mb-1 ml-1 font-semibold">E-MAIL</label><input type="email" id="cli-email" placeholder="email@cliente.com" class="input-glass p-3 rounded-lg text-white"></div>
                 </div>
                 <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                   <div class="flex flex-col"><label class="text-xs text-slate-500 mb-1 ml-1 font-semibold">WHATSAPP / TELEFONE</label><input type="text" id="cli-tel" placeholder="(43) 99999-9999" class="input-glass p-3 rounded-lg text-white"></div>
                 </div>
             </div>
             <div>
                 <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4 mt-6 border-b border-white/5 pb-2">Localização</h3>
                 <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                   <div class="flex flex-col"><label class="text-xs text-yellow-500/80 mb-1 ml-1 font-semibold">CEP (Digite para preencher)</label><input type="text" id="cli-cep" placeholder="00000-000" class="input-glass p-3 rounded-lg font-bold text-yellow-400" onkeyup="if(this.value.replace(/\\D/g,'').length>=8) UI.fetchCEP()" onblur="UI.fetchCEP()"></div>
                 </div>
                 <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                   <div class="flex flex-col md:col-span-9"><label class="text-xs text-slate-500 mb-1 ml-1 font-semibold">RUA / LOGRADOURO</label><input type="text" id="cli-rua" placeholder="Nome da Rua" class="input-glass p-3 rounded-lg text-white"></div>
                   <div class="flex flex-col md:col-span-3"><label class="text-xs text-slate-500 mb-1 ml-1 font-semibold">NÚMERO</label><input type="text" id="cli-num" placeholder="123" class="input-glass p-3 rounded-lg text-white"></div>
                 </div>
                 <div class="grid grid-cols-1 md:grid-cols-12 gap-4 mt-4">
                   <div class="flex flex-col md:col-span-4"><label class="text-xs text-slate-500 mb-1 ml-1 font-semibold">BAIRRO</label><input type="text" id="cli-bairro" placeholder="Bairro" class="input-glass p-3 rounded-lg text-white"></div>
                   <div class="flex flex-col md:col-span-6"><label class="text-xs text-slate-500 mb-1 ml-1 font-semibold">CIDADE</label><input type="text" id="cli-cidade" placeholder="Cidade" class="input-glass p-3 rounded-lg text-white"></div>
                   <div class="flex flex-col md:col-span-2"><label class="text-xs text-slate-500 mb-1 ml-1 font-semibold">UF</label><input type="text" id="cli-uf" placeholder="PR" class="input-glass p-3 rounded-lg text-white"></div>
                 </div>
             </div>
             <div class="flex space-x-4">
                <button onclick="UI.saveCliente()" id="btn-save-cli" class="btn-primary flex-1 py-4 rounded-xl mt-8 text-sm font-bold">SALVAR CLIENTE</button>
                <button onclick="UI.limparFormCliente()" class="py-4 px-6 rounded-xl mt-8 text-sm font-bold border border-white/10 hover:bg-white/5">LIMPAR / NOVO</button>
             </div>
           </div>
        </div>
        <div class="glass p-8 rounded-2xl">
          <h2 class="text-xl font-bold mb-6 text-yellow-400">Meus Clientes Cadastrados</h2>
          <table class="w-full text-left">
            <thead><tr class="text-slate-500 text-xs uppercase tracking-widest border-b border-white/5"><th class="pb-3">Nome</th><th class="pb-3">Contato</th><th class="pb-3">Endereço</th><th class="pb-3">Ações</th></tr></thead>
            <tbody id="lista-clientes"><tr><td colspan="4" class="py-4 text-center text-slate-500">Carregando...</td></tr></tbody>
          </table>
        </div>
      `;
      Data.loadClientes(() => {
        const list = App.state.clientes;
        let h = '';
        if (!list || list.length === 0) {
          h = '<tr><td colspan="4" class="py-4 text-center text-slate-500">Nenhum cliente cadastrado ainda.</td></tr>';
        } else {
          h = list.map(c => {
            const contato = c.tel + (c.email ? '<br><span class="text-xs text-blue-400">' + c.email + '</span>' : '');
            const acoes = `<button onclick="UI.editCliente('${c.id}')" class="text-xs mr-3 text-blue-400 hover:text-blue-300 uppercase font-bold">Editar</button><button onclick="UI.deleteCliente('${c.id}')" class="text-xs text-red-500 hover:text-red-400 uppercase font-bold">Deletar</button>`;
            return `<tr class="border-b border-white/5 hover:bg-white/5"><td class="py-4 font-semibold text-white">${c.nome}</td><td class="py-4 text-slate-400">${contato}</td><td class="py-4 text-slate-400 max-w-xs truncate" title="${c.end}">${c.end}</td><td class="py-4">${acoes}</td></tr>`;
          }).join('');
        }
        document.getElementById('lista-clientes').innerHTML = h;
      });
    },

    limparFormCliente: () => {
      ['cli-id','cli-nome','cli-email','cli-tel','cli-cep','cli-rua','cli-num','cli-bairro','cli-cidade','cli-uf'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('btn-save-cli').innerText = "SALVAR NOVO CLIENTE";
    },

    editCliente: (id) => {
      const cli = App.state.clientes.find(c => c.id === id);
      if (!cli) return;
      document.getElementById('cli-id').value = cli.id;
      document.getElementById('cli-nome').value = cli.nome || '';
      document.getElementById('cli-email').value = cli.email || '';
      document.getElementById('cli-tel').value = cli.tel || '';
      document.getElementById('cli-cep').value = cli.cep || '';
      try {
        const p = cli.end.split(' - ');
        const rn = p[0].split(', ');
        const bc = p[1].split(', ');
        document.getElementById('cli-rua').value = rn[0] || '';
        document.getElementById('cli-num').value = rn[1] || '';
        document.getElementById('cli-bairro').value = bc[0] || '';
        document.getElementById('cli-cidade').value = bc[1] || '';
        document.getElementById('cli-uf').value = p[2] || '';
      } catch (e) {
        document.getElementById('cli-rua').value = cli.end;
      }
      document.getElementById('btn-save-cli').innerText = "ATUALIZAR CLIENTE";
      window.scrollTo(0, 0);
    },

    deleteCliente: (id) => {
      if (!confirm("Tem certeza que deseja excluir esse cliente?")) return;
      google.script.run.withSuccessHandler(() => {
        Data.loadClientes(() => UI.renderClientes());
      }).excluirCliente(App.state.user.id, id);
    },

    fetchCEP: async () => {
      let cep = document.getElementById('cli-cep').value.replace(/\D/g, '');
      if (cep.length === 8) {
        try {
          let res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
          let data = await res.json();
          if (!data.erro) {
            document.getElementById('cli-rua').value = data.logradouro || '';
            document.getElementById('cli-bairro').value = data.bairro || '';
            document.getElementById('cli-cidade').value = data.localidade || '';
            document.getElementById('cli-uf').value = data.uf || '';
            document.getElementById('cli-num').focus();
          }
        } catch (e) { console.error("Erro ViaCEP"); }
      }
    },

    saveCliente: () => {
      const id = document.getElementById('cli-id').value;
      const endMontado = `${document.getElementById('cli-rua').value}, ${document.getElementById('cli-num').value} - ${document.getElementById('cli-bairro').value}, ${document.getElementById('cli-cidade').value} - ${document.getElementById('cli-uf').value}`;
      const dados = {
        nome: document.getElementById('cli-nome').value,
        tel: document.getElementById('cli-tel').value,
        email: document.getElementById('cli-email').value,
        cep: document.getElementById('cli-cep').value,
        end: endMontado
      };
      if (!dados.nome) return alert("Por favor adicione um nome.");
      const btn = document.getElementById('btn-save-cli');
      btn.innerText = "Salvando...";
      btn.disabled = true;
      const done = () => Data.loadClientes(() => UI.renderClientes());
      if (id) {
        google.script.run.withSuccessHandler(done).atualizarCliente(App.state.user.id, id, dados);
      } else {
        google.script.run.withSuccessHandler(done).salvarCliente(App.state.user.id, dados);
      }
    },

    // ---------- ABA DIMENSIONAMENTO ----------
    populateSizingClient: () => {
      const id = document.getElementById('prop-cliente-select').value;
      const campos = ['prop-cliente-nome','prop-cliente-rua','prop-cliente-num','prop-cliente-bairro','prop-cliente-cidade','prop-cliente-uf'];
      if (!id) { campos.forEach(c => document.getElementById(c).value = ''); return; }
      const cli = App.state.clientes.find(c => c.id === id);
      if (cli) {
        document.getElementById('prop-cliente-nome').value = cli.nome;
        try {
          const p = cli.end.split(' - ');
          const rn = p[0].split(', ');
          const bc = p[1].split(', ');
          document.getElementById('prop-cliente-rua').value = rn[0] || '';
          document.getElementById('prop-cliente-num').value = rn[1] || '';
          document.getElementById('prop-cliente-bairro').value = bc[0] || '';
          document.getElementById('prop-cliente-cidade').value = bc[1] || '';
          document.getElementById('prop-cliente-uf').value = p[2] || '';
        } catch (e) {
          document.getElementById('prop-cliente-rua').value = cli.end;
        }
      }
    },

    renderSizing: () => {
      if (!App.state.catalogos) return;

      // Base de irradiação por CIDADE (HSP médio diário - dados CRESESB/INPE)
      const HSP_CIDADES = {

        'Amapá': {'Macapá':4.6,'Santana':4.5,'Laranjal do Jari':4.4,'Oiapoque':4.5},
        'Amazonas': {'Manaus':4.5,'Parintins':4.6,'Itacoatiara':4.5,'Tefé':4.4,'Tabatinga':4.3},
        'Bahia': {'Salvador':5.3,'Feira de Santana':5.4,'Vitória da Conquista':5.5,'Barreiras':5.7,'Juazeiro':5.9,'Ilhéus':4.9,'Itabuna':5.0,'Luís Eduardo Magalhães':5.8},

        'Goiás': {'Goiânia':5.2,'Aparecida de Goiânia':5.2,'Anápolis':5.1,'Rio Verde':5.3,'Itumbiara':5.3,'Jataí':5.2,'Catalão':5.2},
        'Maranhão': {'São Luís':5.1,'Imperatriz':5.3,'Caxias':5.4,'Timon':5.4,'Bacabal':5.2,'Balsas':5.5},
        'Mato Grosso': {'Cuiabá':5.2,'Várzea Grande':5.2,'Rondonópolis':5.1,'Sinop':4.9,'Tangará da Serra':5.0,'Sorriso':5.0,'Lucas do Rio Verde':5.0},
        'Mato Grosso do Sul': {'Campo Grande':5.1,'Dourados':5.0,'Três Lagoas':5.1,'Corumbá':5.2,'Ponta Porã':4.9,'Naviraí':5.0},
        'Minas Gerais': {'Belo Horizonte':5.2,'Uberlândia':5.3,'Contagem':5.2,'Juiz de Fora':4.8,'Betim':5.2,'Montes Claros':5.6,'Uberaba':5.3,'Governador Valadares':5.1,'Divinópolis':5.1,'Poços de Caldas':4.9},

        'Paraíba': {'João Pessoa':5.6,'Campina Grande':5.5,'Santa Rita':5.5,'Patos':5.7,'Cajazeiras':5.6,'Sousa':5.7},
        'Paraná': {'Curitiba':3.9,'Londrina':4.7,'Maringá':4.6,'Ponta Grossa':4.2,'Cascavel':4.5,'Foz do Iguaçu':4.6,'São José dos Pinhais':4.0,'Colombo':3.9,'Guarapuava':4.1,'Paranaguá':3.8,'Toledo':4.5,'Apucarana':4.5,'Umuarama':4.8,'Campo Mourão':4.6,'Cornélio Procópio':4.6,'Cambé':4.7,'Arapongas':4.6,'Rolândia':4.7,'Ibiporã':4.7},
        'Pernambuco': {'Recife':5.5,'Jaboatão dos Guararapes':5.5,'Olinda':5.5,'Caruaru':5.6,'Petrolina':5.9,'Paulista':5.5,'Garanhuns':5.4},
        'Piauí': {'Teresina':5.5,'Parnaíba':5.6,'Picos':5.5,'Piripiri':5.4,'Floriano':5.5,'São Raimundo Nonato':5.8,'Bom Jesus':5.7},
        'Rio de Janeiro': {'Rio de Janeiro':4.7,'São Gonçalo':4.6,'Duque de Caxias':4.6,'Nova Iguaçu':4.6,'Niterói':4.7,'Campos dos Goytacazes':5.0,'Petrópolis':4.4,'Volta Redonda':4.7,'Macaé':4.9},
        'Rio Grande do Norte': {'Natal':5.6,'Mossoró':5.7,'Parnamirim':5.6,'São Gonçalo do Amarante':5.5,'Caicó':5.8,'Açu':5.7},
        'Rio Grande do Sul': {'Porto Alegre':4.3,'Caxias do Sul':4.2,'Pelotas':4.2,'Canoas':4.3,'Santa Maria':4.4,'Passo Fundo':4.3,'Novo Hamburgo':4.3,'São Leopoldo':4.3,'Rio Grande':4.2,'Uruguaiana':4.5,'Ijuí':4.4,'Erechim':4.3},
        'Rondônia': {'Porto Velho':4.6,'Ji-Paraná':4.7,'Ariquemes':4.6,'Vilhena':4.8,'Cacoal':4.7},
        'Roraima': {'Boa Vista':4.6,'Rorainópolis':4.5,'Caracaraí':4.5,'Pacaraima':4.5},
        'Santa Catarina': {'Florianópolis':4.0,'Joinville':3.9,'Blumenau':3.9,'Chapecó':4.4,'São José':4.0,'Criciúma':4.1,'Itajaí':4.0,'Lages':4.2,'Jaraguá do Sul':3.9,'Balneário Camboriú':4.0},

        'Tocantins': {'Palmas':5.3,'Araguaína':5.1,'Gurupi':5.2,'Porto Nacional':5.3,'Paraíso do Tocantins':5.2}
      };

      const optEstados = Object.keys(HSP_CIDADES).map(e => `<option value="${e}">${e}</option>`).join('');

      let optClientes = '<option value="">Selecione um cliente cadastrado...</option>';
      if (App.state.clientes && App.state.clientes.length > 0) {
        optClientes += App.state.clientes.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');
      }

      // Guardar referência global para o cascata
      window._hspCidades = HSP_CIDADES;

      document.getElementById('tab-content').innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
          <div class="lg:col-span-2 space-y-8">
            <div class="glass p-8 rounded-2xl">
               <h2 class="text-xl font-bold mb-6 text-yellow-400">Atribuir a um Cliente</h2>
               <select id="prop-cliente-select" class="input-glass p-4 rounded-xl w-full text-white font-semibold mb-6" onchange="UI.populateSizingClient()">
                 ${optClientes}
               </select>
               <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                 <div class="md:col-span-12"><label class="text-xs text-slate-500 mb-1 ml-1 font-semibold">NOME</label><input type="text" id="prop-cliente-nome" class="input-glass p-3 rounded-lg bg-white/5 opacity-70 w-full" disabled></div>

               <div class="grid grid-cols-1 md:grid-cols-12 gap-4 mt-4">

               </div>
               <div class="grid grid-cols-1 md:grid-cols-12 gap-4 mt-4">
                 <div class="md:col-span-5"><label class="text-xs text-slate-500 mb-1 ml-1 font-semibold">BAIRRO</label><input type="text" id="prop-cliente-bairro" class="input-glass p-3 rounded-lg bg-white/5 opacity-70 w-full" disabled></div>
                 <div class="md:col-span-5"><label class="text-xs text-slate-500 mb-1 ml-1 font-semibold">CIDADE</label><input type="text" id="prop-cliente-cidade" class="input-glass p-3 rounded-lg bg-white/5 opacity-70 w-full" disabled></div>
                 <div class="md:col-span-2"><label class="text-xs text-slate-500 mb-1 ml-1 font-semibold">UF</label><input type="text" id="prop-cliente-uf" class="input-glass p-3 rounded-lg bg-white/5 opacity-70 w-full" disabled></div>
               </div>
            </div>

            <div class="glass p-8 rounded-2xl">
              <h2 class="text-xl font-bold mb-6 text-yellow-400">Dados do Projeto</h2>
              <div class="space-y-6">
                <div>
                  <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Consumo Médio Atual (kWh/mês)</label>
                  <input type="number" id="calc-kwh" class="input-glass w-full p-4 rounded-xl text-2xl font-bold text-yellow-400" placeholder="Ex: 600" oninput="Calc.update()">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Estado</label>
                    <select id="calc-estado" class="input-glass w-full p-4 rounded-xl" onchange="Calc.carregarCidades()">
                      <option value="">Selecione o Estado...</option>
                      ${optEstados}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Cidade</label>
                    <select id="calc-cidade" class="input-glass w-full p-4 rounded-xl" onchange="Calc.update()" disabled>
                      <option value="">Primeiro selecione o estado...</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="glass p-8 rounded-2xl sticky top-24 self-start">
            <h3 class="text-lg font-bold mb-4 uppercase text-slate-400 border-b border-white/5 pb-2">Resultado</h3>
            <div class="space-y-6">
              <div>
                <p class="text-xs uppercase font-bold text-slate-400 mb-2">Pela localidade, o cliente precisa de:</p>
                <div class="text-4xl font-bold text-yellow-500"><span id="res-kwp">0.00</span> <span class="text-xl">kWp</span></div>
              </div>
              <div class="p-4 bg-white/5 rounded-xl text-sm text-center text-slate-400">
                <p>O dimensionamento calcula a potência do arranjo fotovoltaico necessário para suprir o consumo mensal.</p>
              </div>
            </div>
          </div>
        </div>
      `;
    },

    // ---------- ABA ORÇAMENTOS ----------
    renderOrcamentos: () => {
      document.getElementById('tab-content').innerHTML = `
        <div class="glass p-8 rounded-2xl">
          <h2 class="text-2xl font-bold mb-6 text-yellow-400">Histórico de Propostas</h2>
          <table class="w-full text-left">
            <thead><tr class="text-slate-500 text-xs uppercase tracking-widest border-b border-white/5"><th class="pb-3">Data</th><th class="pb-3">Cliente</th><th class="pb-3">Valor</th><th class="pb-3">PDF</th></tr></thead>
            <tbody id="lista-orca"></tbody>
          </table>
        </div>
      `;
      google.script.run.withSuccessHandler(list => {
        document.getElementById('lista-orca').innerHTML = list.map(o => `<tr class="border-b border-white/5 hover:bg-white/5"><td class="py-4 text-slate-400">${o.data}</td><td class="py-4 font-bold text-white">${o.cliente}</td><td class="py-4 text-green-400">${o.valor}</td><td class="py-4"><a href="${o.url}" target="_blank" class="text-yellow-400 font-bold hover:underline">Ver PDF</a></td></tr>`).join('');
      }).listarOrcamentos(App.state.user.id);
    }
  };

  // =============================================
  // CALC - Cálculo de Dimensionamento
  // =============================================
  const Calc = {
    dadosAuais: {},

    carregarCidades: () => {
      const estado = document.getElementById('calc-estado').value;
      const selCidade = document.getElementById('calc-cidade');
      if (!estado) {
        selCidade.innerHTML = '<option value="">Primeiro selecione o estado...</option>';
        selCidade.disabled = true;
        document.getElementById('res-kwp').innerText = '0.00';
        return;
      }
      const cidades = window._hspCidades[estado];
      let opts = '<option value="">Selecione a cidade...</option>';
      Object.keys(cidades).sort().forEach(c => {
        opts += `<option value="${cidades[c]}">${c}</option>`;
      });
      selCidade.innerHTML = opts;
      selCidade.disabled = false;
    },

    update: () => {
      const kwh = parseFloat(document.getElementById('calc-kwh').value);
      const hspStr = document.getElementById('calc-cidade').value;

      if (kwh && hspStr) {
        const hsp = parseFloat(hspStr);
        const ef = 0.83; // Eficiência N-type (painéis modernos)
        const kwpCalculado = (kwh / 30) / (hsp * ef);
        document.getElementById('res-kwp').innerText = kwpCalculado.toFixed(2);
        Calc.dadosAuais.kwh = kwh;
        Calc.dadosAuais.kwp = kwpCalculado.toFixed(2);
      }
    }
  };
</script>
