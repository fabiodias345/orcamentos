<script>
  /**
   * CORE ENGINE: SOLAR PRO
   */
  const App = {
    state: {
      isLoggedIn: false,
      user: null, 
      activeTab: 'empresa',
      catalogos: null,
      clientes: [] // Cache global de clientes
    },

    init: () => {
      const savedUser = localStorage.getItem('solar_pro_user');
      if (savedUser) {
        App.state.user = JSON.parse(savedUser);
        App.state.isLoggedIn = true;
        Router.render('dashboard');
        Data.loadCatalogs();
      } else {
        Router.render('auth');
        document.getElementById('loader').classList.add('hidden');
        document.getElementById('main-content').classList.remove('hidden');
      }
    }
  };

  const Data = {
    loadCatalogs: () => {
      google.script.run
        .withSuccessHandler(cat => {
          App.state.catalogos = cat;
          document.getElementById('loader').classList.add('hidden');
          document.getElementById('main-content').classList.remove('hidden');
          if(App.state.activeTab === 'sizing') UI.renderSizing();
        })
        .getCatalogos();

      Data.loadClientes(); // Puxa e faz cache da lista de clientes 
    },
    loadClientes: (callback) => {
      google.script.run
        .withSuccessHandler(list => {
           App.state.clientes = list || [];
           if (callback) callback();
        }).listarClientes(App.state.user.id);
    }
  };

  const Router = {
    render: (view) => {
      const container = document.getElementById('main-content');
      if (view === 'auth') {
        container.innerHTML = document.getElementById('tpl-auth').innerHTML;
      } else {
        container.innerHTML = document.getElementById('tpl-dashboard').innerHTML;
        document.getElementById('nav-user-name').innerText = App.state.user.nome;
        Router.renderTab(App.state.activeTab);
      }
    },

    to: (tab) => {
      App.state.activeTab = tab;
      Router.renderTab(tab);
      document.querySelectorAll('.nav-tab').forEach(el => {
        el.classList.remove('active');
        if (el.innerText.toLowerCase().includes(tab.substring(0,3))) el.classList.add('active');
      });
    },

    renderTab: (tab) => {
      const container = document.getElementById('tab-content');
      container.innerHTML = `<div class="p-12 text-center text-slate-500">Carregando ${tab}...</div>`;
      switch(tab) {
        case 'empresa': UI.renderEmpresa(); break;
        case 'clientes': UI.renderClientes(); break;
        case 'sizing': UI.renderSizing(); break;
        case 'orcamentos': UI.renderOrcamentos(); break;
      }
    }
  };

  const Auth = {
    toggleMode: (mode) => {
      document.getElementById('auth-login-box').classList.toggle('hidden', mode !== 'login');
      document.getElementById('auth-signup-box').classList.toggle('hidden', mode !== 'signup');
      document.getElementById('auth-subtitle').innerText = mode === 'login' ? 'Acesse sua conta' : 'Crie sua conta profissional';
    },

    handleLogin: () => {
      const user = document.getElementById('login-user').value;
      const pass = document.getElementById('login-pass').value;
      if (!user || !pass) return UI.msg('Preencha os campos', 'error');

      google.script.run
        .withSuccessHandler(res => {
          if (res.success) {
            App.state.user = { id: res.userId, nome: res.nome };
            App.state.isLoggedIn = true;
            localStorage.setItem('solar_pro_user', JSON.stringify(App.state.user));
            Router.render('dashboard');
            Data.loadCatalogs();
          } else {
            UI.msg(res.message, 'error');
          }
        })
        .login(user, pass);
    },

    handleSignup: () => {
      const nome = document.getElementById('signup-name').value;
      const user = document.getElementById('signup-user').value;
      const pass = document.getElementById('signup-pass').value;
      if (!nome || !user || !pass) return UI.msg('Preencha tudo', 'error');

      google.script.run
        .withSuccessHandler(res => {
          if (res.success) {
            UI.msg('Conta criada! Faça login.', 'success');
            Auth.toggleMode('login');
          } else {
            UI.msg(res.message, 'error');
          }
        })
        .signup(nome, user, pass);
    },

    logout: () => {
      localStorage.removeItem('solar_pro_user');
      location.reload();
    }
  };

  const UI = {
    msg: (text, type) => {
      const box = document.getElementById('auth-message');
      box.innerText = text;
      box.className = `mt-4 p-3 rounded-lg text-sm text-center ${type === 'error' ? 'bg-red-500/10 text-red-400' : 'bg-green-500/10 text-green-400'}`;
      box.classList.remove('hidden');
    },

    renderEmpresa: () => {
      const container = document.getElementById('tab-content');
      google.script.run.withSuccessHandler(d => {
        container.innerHTML = `
          <div class="glass p-8 rounded-2xl max-w-2xl mx-auto animate-fade-in">
            <h2 class="text-2xl font-bold mb-6 text-yellow-400">Minha Empresa</h2>
            <div class="space-y-4">
              <input type="text" id="emp-nome" placeholder="Nome Comercial" class="input-glass p-3 rounded-lg w-full" value="${d?.nome||''}">
              <div class="grid grid-cols-2 gap-4">
                <input type="text" id="emp-cnpj" placeholder="CNPJ" class="input-glass p-3 rounded-lg" value="${d?.cnpj||''}">
                <input type="text" id="emp-tel" placeholder="Telefone" class="input-glass p-3 rounded-lg" value="${d?.tel||''}">
              </div>
              <input type="text" id="emp-email" placeholder="E-mail" class="input-glass p-3 rounded-lg w-full" value="${d?.email||''}">
              <input type="text" id="emp-end" placeholder="Endereço Completo" class="input-glass p-3 rounded-lg w-full" value="${d?.end||''}">
              <input type="text" id="emp-logo" placeholder="URL Extensa da Logomarca (Png/Jpg)" class="input-glass p-3 rounded-lg w-full" value="${d?.logo||''}">
              <button onclick="UI.saveEmpresa()" class="btn-primary w-full py-3 rounded-xl mt-4">SALVAR MINHA EMPRESA</button>
            </div>
          </div>
        `;
      }).buscarEmpresa(App.state.user.id);
    },

    saveEmpresa: () => {
      const dados = {
        nome: document.getElementById('emp-nome').value,
        cnpj: document.getElementById('emp-cnpj').value,
        tel: document.getElementById('emp-tel').value,
        email: document.getElementById('emp-email').value,
        end: document.getElementById('emp-end').value,
        logo: document.getElementById('emp-logo').value
      };
      google.script.run.withSuccessHandler(res => alert('Configurações Salvas!')).salvarEmpresa(App.state.user.id, dados);
    },

    renderClientes: () => { 
      document.getElementById('tab-content').innerHTML = `
        <div class="glass p-8 rounded-2xl mb-8">
           <h2 class="text-xl font-bold mb-6 text-yellow-400">Cadastrar/Editar Cliente</h2>
           
           <input type="hidden" id="cli-id" value="">
           
           <div class="space-y-6">
             <!-- Seção de Contato -->
             <div>
                 <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4 border-b border-white/5 pb-2">Informações Pessoais</h3>
                 <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                   <div class="flex flex-col">
                     <label class="text-xs text-slate-500 mb-1 ml-1 font-semibold">NOME COMPLETO</label>
                     <input type="text" id="cli-nome" placeholder="Ex: João da Silva" class="input-glass p-3 rounded-lg text-white">
                   </div>
                   <div class="flex flex-col">
                     <label class="text-xs text-slate-500 mb-1 ml-1 font-semibold">E-MAIL</label>
                     <input type="email" id="cli-email" placeholder="email@cliente.com" class="input-glass p-3 rounded-lg text-white">
                   </div>
                 </div>
                 <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                   <div class="flex flex-col">
                     <label class="text-xs text-slate-500 mb-1 ml-1 font-semibold">WHATSAPP / TELEFONE</label>
                     <input type="text" id="cli-tel" placeholder="(43) 99999-9999" class="input-glass p-3 rounded-lg text-white">
                   </div>
                 </div>
             </div>

             <!-- Seção de Endereço -->
             <div>
                 <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4 mt-6 border-b border-white/5 pb-2">Localização</h3>
                 <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                   <div class="flex flex-col">
                     <label class="text-xs text-yellow-500/80 mb-1 ml-1 font-semibold">CEP (Digite para preencher)</label>
                     <input type="text" id="cli-cep" placeholder="00000-000" class="input-glass p-3 rounded-lg font-bold text-yellow-400" onkeyup="if(this.value.length>=8) UI.fetchCEP()" onblur="UI.fetchCEP()">
                   </div>
                 </div>
                 
                 <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                   <div class="flex flex-col md:col-span-9">
                     <label class="text-xs text-slate-500 mb-1 ml-1 font-semibold">RUA / LOGRADOURO</label>
                     <input type="text" id="cli-rua" placeholder="Nome da Rua" class="input-glass p-3 rounded-lg text-white">
                   </div>
                   <div class="flex flex-col md:col-span-3">
                     <label class="text-xs text-slate-500 mb-1 ml-1 font-semibold">NÚMERO</label>
                     <input type="text" id="cli-num" placeholder="Ex: 123" class="input-glass p-3 rounded-lg text-white">
                   </div>
                 </div>

                 <div class="grid grid-cols-1 md:grid-cols-12 gap-4 mt-4">
                   <div class="flex flex-col md:col-span-4">
                     <label class="text-xs text-slate-500 mb-1 ml-1 font-semibold">BAIRRO</label>
                     <input type="text" id="cli-bairro" placeholder="Bairro" class="input-glass p-3 rounded-lg text-white">
                   </div>
                   <div class="flex flex-col md:col-span-6">
                     <label class="text-xs text-slate-500 mb-1 ml-1 font-semibold">CIDADE</label>
                     <input type="text" id="cli-cidade" placeholder="Cidade" class="input-glass p-3 rounded-lg text-white">
                   </div>
                   <div class="flex flex-col md:col-span-2">
                     <label class="text-xs text-slate-500 mb-1 ml-1 font-semibold">UF</label>
                     <input type="text" id="cli-uf" placeholder="PR" class="input-glass p-3 rounded-lg text-white">
                   </div>
                 </div>
             </div>
             
             <div class="flex space-x-4">
                <button onclick="UI.saveCliente()" id="btn-save-cli" class="btn-primary flex-1 py-4 rounded-xl mt-8 text-sm font-bold shadow-yellow-500/20">SALVAR CLIENTE</button>
                <button onclick="UI.limparFormCliente()" class="btn-secondary py-4 px-6 rounded-xl mt-8 text-sm font-bold">LIMPAR / NOVO</button>
             </div>
             
           </div>
        </div>

        <div class="glass p-8 rounded-2xl">
          <h2 class="text-xl font-bold mb-6 text-yellow-400">Meus Clientes Cadastrados</h2>
          <table class="w-full text-left">
            <thead><tr class="text-slate-500 text-xs uppercase tracking-widest border-b border-white/5"><th class="pb-3">Nome</th><th class="pb-3">Contato</th><th class="pb-3">Endereço</th><th class="pb-3">Ações</th></tr></thead>
            <tbody id="lista-clientes">
              <tr><td colspan="4" class="py-4 text-center text-slate-500">Carregando lista de clientes...</td></tr>
            </tbody>
          </table>
        </div>
      `;
      Data.loadClientes(() => {
        let h = "";
        const list = App.state.clientes;
        if(!list || list.length === 0) {
            h = '<tr><td colspan="4" class="py-4 text-center text-slate-500">Nenhum cliente cadastrado ainda.</td></tr>';
        } else {
            h = list.map(c => {
                const contato = c.tel + (c.email ? '<br><span class="text-xs text-blue-400">' + c.email + '</span>' : '');
                const acoes = `<button onclick="UI.editCliente('${c.id}')" class="text-xs mr-3 text-blue-400 hover:text-blue-300 uppercase font-bold tracking-wider">Editar</button><button onclick="UI.deleteCliente('${c.id}')" class="text-xs text-red-500 hover:text-red-400 uppercase font-bold tracking-wider">Deletar</button>`;
                return `<tr class="border-b border-white/5 hover:bg-white/5"><td class="py-4 font-semibold text-white">${c.nome}</td><td class="py-4 text-slate-400">${contato}</td><td class="py-4 text-slate-400 max-w-xs truncate" title="${c.end}">${c.end}</td><td class="py-4">${acoes}</td></tr>`
            }).join('');
        }
        document.getElementById('lista-clientes').innerHTML = h;
      });
    },

    limparFormCliente: () => {
      document.getElementById('cli-id').value = '';
      document.getElementById('cli-nome').value = '';
      document.getElementById('cli-email').value = '';
      document.getElementById('cli-tel').value = '';
      document.getElementById('cli-cep').value = '';
      document.getElementById('cli-rua').value = '';
      document.getElementById('cli-num').value = '';
      document.getElementById('cli-bairro').value = '';
      document.getElementById('cli-cidade').value = '';
      document.getElementById('cli-uf').value = '';
      document.getElementById('btn-save-cli').innerText = "SALVAR NOVO CLIENTE";
    },

    editCliente: (id) => {
      const cli = App.state.clientes.find(c => c.id === id);
      if(!cli) return;
      document.getElementById('cli-id').value = cli.id;
      document.getElementById('cli-nome').value = cli.nome || '';
      document.getElementById('cli-email').value = cli.email || '';
      document.getElementById('cli-tel').value = cli.tel || '';
      document.getElementById('cli-cep').value = cli.cep || '';
      
      // Tenta quebrar o endereço (Rua, num - bairro, cidade - UF)
      try {
        const pedacosEnd = cli.end.split(' - ');
        const ruaNum = pedacosEnd[0].split(', ');
        const bairroCidade = pedacosEnd[1].split(', ');
        
        document.getElementById('cli-rua').value = ruaNum[0] || '';
        document.getElementById('cli-num').value = ruaNum[1] || '';
        document.getElementById('cli-bairro').value = bairroCidade[0] || '';
        document.getElementById('cli-cidade').value = bairroCidade[1] || '';
        document.getElementById('cli-uf').value = pedacosEnd[2] || '';
      } catch(e) {
        // Fallback em caso de sujeira nos dados antigos
        document.getElementById('cli-rua').value = cli.end;
      }
      
      document.getElementById('btn-save-cli').innerText = "ATUALIZAR CLIENTE";
      window.scrollTo(0,0);
    },

    deleteCliente: (id) => {
      if(!confirm("Tem certeza que deseja excluir esse cliente defitivamente?")) return;
      document.getElementById('tab-content').innerHTML = `<div class="p-12 text-center text-red-500">Excluindo...</div>`;
      google.script.run.withSuccessHandler(res => {
         Data.loadClientes(() => UI.renderClientes());
      }).excluirCliente(App.state.user.id, id);
    },

    fetchCEP: async () => {
      let cep = document.getElementById('cli-cep').value.replace(/\D/g, '');
      if(cep.length === 8) {
         try {
             let res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
             let data = await res.json();
             if(!data.erro) {
                 document.getElementById('cli-rua').value = data.logradouro || '';
                 document.getElementById('cli-bairro').value = data.bairro || '';
                 document.getElementById('cli-cidade').value = data.localidade || '';
                 document.getElementById('cli-uf').value = data.uf || '';
                 document.getElementById('cli-num').focus(); // Joga pra ele
             }
         } catch(e) { console.error("Erro no viacep"); }
      }
    },

    saveCliente: () => {
      const id = document.getElementById('cli-id').value;
      const rua = document.getElementById('cli-rua').value;
      const num = document.getElementById('cli-num').value;
      const bairro = document.getElementById('cli-bairro').value;
      const cid = document.getElementById('cli-cidade').value;
      const uf = document.getElementById('cli-uf').value;
      
      const endMontado = `${rua}, ${num} - ${bairro}, ${cid} - ${uf}`;

      const dados = {
        nome: document.getElementById('cli-nome').value,
        tel: document.getElementById('cli-tel').value,
        email: document.getElementById('cli-email').value,
        cep: document.getElementById('cli-cep').value,
        end: endMontado
      };
      
      if(!dados.nome) return alert("Por favor adicione um nome.");
      
      const btn = document.getElementById('btn-save-cli');
      btn.innerText = "Salvando...";
      btn.disabled = true;

      const handler = res => {
          Data.loadClientes(() => UI.renderClientes());
      };

      if(id) {
         google.script.run.withSuccessHandler(handler).atualizarCliente(App.state.user.id, id, dados);
      } else {
         google.script.run.withSuccessHandler(handler).salvarCliente(App.state.user.id, dados);
      }
    },

    populateSizingClient: () => {
      const id = document.getElementById('prop-cliente-select').value;
      if(!id) {
         document.getElementById('prop-cliente-nome').value = '';
         document.getElementById('prop-cliente-end').value = '';
         return;
      }
      const cli = App.state.clientes.find(c => c.id === id);
      if(cli) {
         document.getElementById('prop-cliente-nome').value = cli.nome;
         document.getElementById('prop-cliente-end').value = cli.end;
      }
    },

    renderSizing: () => {
      if(!App.state.catalogos) return; 
      const cat = App.state.catalogos;
      
      // HSP com Fallback pros 27 Estados do Brasil
      let hspList = cat.hsp;
      if(!hspList || hspList.length === 0) {
        hspList = [
          {UF:'AC', HSP_Media_Diaria: 4.5}, {UF:'AL', HSP_Media_Diaria: 5.4}, {UF:'AP', HSP_Media_Diaria: 4.5},
          {UF:'AM', HSP_Media_Diaria: 4.5}, {UF:'BA', HSP_Media_Diaria: 5.3}, {UF:'CE', HSP_Media_Diaria: 5.5},
          {UF:'DF', HSP_Media_Diaria: 5.2}, {UF:'ES', HSP_Media_Diaria: 4.8}, {UF:'GO', HSP_Media_Diaria: 5.1},
          {UF:'MA', HSP_Media_Diaria: 5.2}, {UF:'MT', HSP_Media_Diaria: 5.1}, {UF:'MS', HSP_Media_Diaria: 5.0},
          {UF:'MG', HSP_Media_Diaria: 5.2}, {UF:'PA', HSP_Media_Diaria: 4.7}, {UF:'PB', HSP_Media_Diaria: 5.5},
          {UF:'PR', HSP_Media_Diaria: 4.4}, {UF:'PE', HSP_Media_Diaria: 5.5}, {UF:'PI', HSP_Media_Diaria: 5.4},
          {UF:'RJ', HSP_Media_Diaria: 4.7}, {UF:'RN', HSP_Media_Diaria: 5.5}, {UF:'RS', HSP_Media_Diaria: 4.3},
          {UF:'RO', HSP_Media_Diaria: 4.6}, {UF:'RR', HSP_Media_Diaria: 4.5}, {UF:'SC', HSP_Media_Diaria: 4.3},
          {UF:'SP', HSP_Media_Diaria: 4.6}, {UF:'SE', HSP_Media_Diaria: 5.3}, {UF:'TO', HSP_Media_Diaria: 5.2}
        ];
      }
      
      const optUF = hspList.map(x => `<option value="${x.UF}|${x.HSP_Media_Diaria}">${x.UF} (HSP médio: ${x.HSP_Media_Diaria})</option>`).join('');
      const optMod = cat.modulos.map((x,i) => `<option value="${i}">${x.Fabricante} ${x.Modelo} - ${x.Potencia_W}w (R$ ${x.Preco_Custo})</option>`).join('');
      const optInv = cat.inversores.map((x,i) => `<option value="${i}">${x.Fabricante} ${x.Modelo} - ${x.Potencia_KW}kW (R$ ${x.Preco_Custo})</option>`).join('');

      let optClientes = '<option value="">Selecione um cliente cadastrado...</option>';
      if(App.state.clientes && App.state.clientes.length > 0) {
          optClientes += App.state.clientes.map(c => `<option value="${c.id}">${c.nome}</option>`).join('');
      }

      document.getElementById('tab-content').innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8" id="sizing-area">
          <div class="lg:col-span-2 space-y-8">
            <div class="glass p-8 rounded-2xl">
               <h2 class="text-xl font-bold mb-6 text-yellow-400">Atribuir a um Cliente</h2>
               <select id="prop-cliente-select" class="input-glass p-4 rounded-xl w-full text-white font-semibold mb-4" onchange="UI.populateSizingClient()">
                 ${optClientes}
               </select>
               <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                 <input type="text" id="prop-cliente-nome" placeholder="Nome vai aparecer aqui" class="input-glass p-3 rounded-lg opacity-50 cursor-not-allowed" disabled>
                 <input type="text" id="prop-cliente-end" placeholder="Endereço vai aparecer aqui" class="input-glass p-3 rounded-lg opacity-50 cursor-not-allowed" disabled>
               </div>
            </div>

            <div class="glass p-8 rounded-2xl">
              <h2 class="text-xl font-bold mb-6 text-yellow-400">Dimensionamento</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Consumo Médio (kWh/mês)</label>
                  <input type="number" id="calc-kwh" class="input-glass w-full p-4 rounded-xl text-2xl font-bold text-yellow-400" placeholder="600" oninput="Calc.update()">
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Estado (Radiação)</label>
                  <select id="calc-uf" class="input-glass w-full p-4 rounded-xl" onchange="Calc.update()">
                    <option value="">Selecione a Região...</option>
                    ${optUF}
                  </select>
                </div>
              </div>
            </div>

            <div class="glass p-8 rounded-2xl">
              <h2 class="text-xl font-bold mb-6 text-yellow-400">Equipamentos</h2>
              <div class="space-y-4">
                <select id="calc-mod" class="input-glass w-full p-4 rounded-xl" onchange="Calc.update()"><option value="">Selecione o Módulo Solar...</option>${optMod}</select>
                <select id="calc-inv" class="input-glass w-full p-4 rounded-xl" onchange="Calc.update()"><option value="">Selecione o Inversor Solar...</option>${optInv}</select>
              </div>
            </div>
          </div>

          <!-- Resumo Financeiro & Tecnico -->
          <div class="glass p-8 rounded-2xl sticky top-24 self-start">
            <h3 class="text-lg font-bold mb-4 uppercase text-slate-400">Resumo da Calculadora</h3>
            <div class="space-y-6">
              <div>
                <p class="text-xs uppercase font-bold text-slate-500">Potência Requerida</p>
                <div class="text-4xl font-bold text-yellow-400"><span id="res-kwp">0.00</span> <span class="text-sm">kWp</span></div>
              </div>
              <div class="p-4 bg-white/5 rounded-xl space-y-2 text-sm">
                <div class="flex justify-between"><span class="text-slate-400">Qtd. Módulos calculada:</span><span id="res-mod-qty" class="font-bold text-white">0</span></div>
                <div class="flex justify-between mt-2 pt-2 border-t border-white/10"><span class="text-slate-400">Investimento Total (Venda):</span><span id="res-val" class="text-green-400 font-bold text-lg">R$ 0,00</span></div>
                <div class="flex justify-between"><span class="text-slate-400">Payback Estimado:</span><span id="res-payback" class="text-blue-400 font-bold">0 Anos</span></div>
              </div>
              <button onclick="Calc.gerarProposta()" id="btn-proposta" class="btn-primary w-full py-4 rounded-xl shadow-lg mt-4 shadow-yellow-500/20">GERAR PDF COMERCIAL</button>
            </div>
          </div>
        </div>
      `;
    },

    renderOrcamentos: () => {
      document.getElementById('tab-content').innerHTML = `
        <div class="glass p-8 rounded-2xl">
          <h2 class="text-2xl font-bold mb-6 text-yellow-400">Histórico de Propostas</h2>
          <table class="w-full text-left">
            <thead><tr class="text-slate-500 text-xs uppercase tracking-widest border-b border-white/5"><th class="pb-3">Data</th><th class="pb-3">Cliente</th><th class="pb-3">Valor</th><th class="pb-3">PDF</th></tr></thead>
            <tbody id="lista-orca"></tbody>
          </table>
        </div>
      `;
      google.script.run.withSuccessHandler(list => {
        document.getElementById('lista-orca').innerHTML = list.map(o => `<tr class="border-b border-white/5 hover:bg-white/5"><td class="py-4 text-slate-400">${o.data}</td><td class="py-4 font-bold text-white">${o.cliente}</td><td class="py-4 text-green-400">${o.valor}</td><td class="py-4"><a href="${o.url}" target="_blank" class="text-yellow-400 font-bold hover:underline">Ver PDF</a></td></tr>`).join('');
      }).listarOrcamentos(App.state.user.id);
    }
  };

  const Calc = {
    dadosAuais: {},

    update: () => {
      const cat = App.state.catalogos;
      const kwh = parseFloat(document.getElementById('calc-kwh').value);
      const ufData = document.getElementById('calc-uf').value;
      const modIdx = document.getElementById('calc-mod').value;
      const invIdx = document.getElementById('calc-inv').value;

      if(kwh && ufData) {
        const hsp = parseFloat(ufData.split('|')[1]);
        const ef = 0.80; 
        
        const kwpCalculado = (kwh / 30) / (hsp * ef);
        document.getElementById('res-kwp').innerText = kwpCalculado.toFixed(2);
        
        Calc.dadosAuais.kwh = kwh;
        Calc.dadosAuais.kwp = kwpCalculado.toFixed(2);
        Calc.dadosAuais.economiaAnual = "R$ " + (kwh * (cat.financeiro.Tarifa_KWH || 0.95) * 12).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});

        let custoTotalMaterial = 0;
        if(modIdx !== "") {
          const modInfo = cat.modulos[modIdx];
          const potW = modInfo.Potencia_W;
          const qtd = Math.ceil((kwpCalculado * 1000) / potW);
          document.getElementById('res-mod-qty').innerText = qtd;
          custoTotalMaterial += (qtd * modInfo.Preco_Custo);
          
          Calc.dadosAuais.qtdPaineis = qtd;
          Calc.dadosAuais.fabricanteModulo = modInfo.Fabricante;
          Calc.dadosAuais.potenciaModulo = potW;
        }

        if(invIdx !== "") {
          const invInfo = cat.inversores[invIdx];
          custoTotalMaterial += invInfo.Preco_Custo;
          Calc.dadosAuais.inversorStr = invInfo.Fabricante + " " + invInfo.Modelo;
        }

        if(modIdx !== "" && invIdx !== "") {
          const p = cat.financeiro || {};
          const maoDeObra = (p.Custo_Mao_Obra_KWP || 500) * kwpCalculado;
          const custoBruto = custoTotalMaterial + maoDeObra;
          
          const margem = (p.Margem_Lucro_Percent || 0) / 100;
          const impostos = (p.Impostos_Percent || 0) / 100;
          const valorVenda = custoBruto * (1 + margem) * (1 + impostos);
          
          document.getElementById('res-val').innerText = "R$ " + valorVenda.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
          Calc.dadosAuais.valorFormatado = "R$ " + valorVenda.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
          Calc.dadosAuais.valorNum = valorVenda;

          const eko = kwh * (p.Tarifa_KWH || 0.95) * 12;
          const pbk = valorVenda / eko;
          document.getElementById('res-payback').innerText = pbk.toFixed(1) + " Anos";
          Calc.dadosAuais.payback = pbk.toFixed(1);
        }
      }
    },

    gerarProposta: () => {
      const cNome = document.getElementById('prop-cliente-nome').value;
      if(!cNome) return alert("Selecione um cliente na lista primeiro para que o nome e endereço apareçam no PDF.");
      if(!Calc.dadosAuais.valorNum) return alert("Selecione todos os equipamentos da lista e digite um consumo para gerar a matemática financeira.");

      const btn = document.getElementById('btn-proposta');
      btn.innerText = "GERANDO PDF NO DRIVE E SALVANDO (Aguarde...)";
      btn.classList.add('opacity-50');
      btn.style.cursor = "not-allowed";

      Calc.dadosAuais.cliente = {
        nome: cNome,
        endereco: document.getElementById('prop-cliente-end').value || ''
      };

      google.script.run
        .withSuccessHandler(res => {
          btn.innerText = "GERAR PDF COMERCIAL";
          btn.classList.remove('opacity-50');
          btn.style.cursor = "pointer";
          if(res.success) {
            alert("Sucesso absoluto! PDF gerado e salvo na sua aba de Orçamentos.");
            window.open(res.url, "_blank");
            Router.to('orcamentos'); 
          } else {
            alert(res.message);
          }
        })
        .gerarProposta(App.state.user.id, Calc.dadosAuais);
    }
  };
</script>
