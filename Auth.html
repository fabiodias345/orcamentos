<div class="min-h-screen flex items-center justify-center p-4">
  <div class="glass max-w-md w-full p-8 rounded-2xl animate-fade-in">
    
    <div class="text-center mb-8">
      <div class="mx-auto w-16 h-16 bg-yellow-400 rounded-2xl flex items-center justify-center text-slate-900 text-3xl mb-4 shadow-xl shadow-yellow-400/20">
        ☀
      </div>
      <h2 class="text-3xl font-bold tracking-tight">Solar PRO</h2>
      <p class="text-slate-400 mt-2" id="auth-subtitle">Acesse sua conta para gerenciar orçamentos</p>
    </div>

    <!-- Login Form -->
    <div id="auth-login-box">
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1">Usuário</label>
          <input type="text" id="login-user" class="input-glass w-full rounded-xl px-4 py-3" placeholder="seu_usuario">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1">Senha</label>
          <input type="password" id="login-pass" class="input-glass w-full rounded-xl px-4 py-3" placeholder="••••••••">
        </div>
        <button onclick="Auth.handleLogin()" class="btn-primary w-full py-4 rounded-xl mt-6 shadow-lg">ENTRAR NO SISTEMA</button>
      </div>
      <p class="text-center text-slate-400 text-sm mt-6">
        Não tem conta? <a href="#" onclick="Auth.toggleMode('signup')" class="text-yellow-400 font-bold hover:underline">Cadastre-se</a>
      </p>
    </div>

    <!-- Signup Form -->
    <div id="auth-signup-box" class="hidden">
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1">Nome Completo</label>
          <input type="text" id="signup-name" class="input-glass w-full rounded-xl px-4 py-3" placeholder="João Silva">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1">Usuário</label>
          <input type="text" id="signup-user" class="input-glass w-full rounded-xl px-4 py-3" placeholder="usuario_exemplo">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1">Senha</label>
          <input type="password" id="signup-pass" class="input-glass w-full rounded-xl px-4 py-3" placeholder="••••••••">
        </div>
        <button onclick="Auth.handleSignup()" class="btn-primary w-full py-4 rounded-xl mt-6 shadow-lg">CRIAR MINHA CONTA</button>
      </div>
      <p class="text-center text-slate-400 text-sm mt-6">
        Já possui conta? <a href="#" onclick="Auth.toggleMode('login')" class="text-yellow-400 font-bold hover:underline">Fazer Login</a>
      </p>
    </div>

    <div id="auth-message" class="mt-4 p-3 rounded-lg text-sm text-center hidden"></div>
  </div>
</div>
